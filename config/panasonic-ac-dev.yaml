esphome:
  name: panasonic-ac-dev
  friendly_name: Panasonic AC Development

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Panasonic AC Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password


i2c:
- id: i2c_bus_a
  sda: 17
  scl: 18
  scan: true
#  frequency: 50000.0

sensor:
  - platform: sht3xd
    i2c_id: i2c_bus_a
    temperature:
      name: "SHT30: Temperatur"
      accuracy_decimals: 1
    humidity:
      name: "SHT30: Feuchtigkeit"
      accuracy_decimals: 1
    address: 0x44
    update_interval: 10s
    
  - platform: bmp280_i2c
    i2c_id: i2c_bus_a
    temperature:
      name: "BMP280: Temperatur"
      # oversampling: 16x
      accuracy_decimals: 1
    pressure:
      name: "BMP280: Luftdruck"
      accuracy_decimals: 1
    address: 0x76
    update_interval: 10s

  - platform: wifi_signal
    name: ESP32 WiFi Signal
    update_interval: 10s

  - platform: uptime
    name: ESP32 Uptime
    update_interval: 10s



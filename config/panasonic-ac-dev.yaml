esphome:
  name: panasonic-ac-dev
  friendly_name: Panasonic AC Development

  on_boot:
    priority: 800
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 1%
          blue: 0%
          brightness: 5%

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Panasonic AC Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true

    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB

uart:
  id: panasonic_uart
  tx_pin: GPIO20
  rx_pin: GPIO19
  baud_rate: 9600
  parity: EVEN

  debug:
    direction: both
    dummy_receiver: false
    after:
      timeout: 10ms

external_components:
  - source:
      type: local
      path: ../components
    components:
      - panasonic_ac

climate:
  - platform: panasonic_ac
    id: panasonic_ac_climate
    name: Panasonic AC

    # CN-CNT:
    type: cnt

    horizontal_swing_select:
      name: Horizontal Swing

    vertical_swing_select:
      name: Vertical Swing

    outside_temperature:
      name: Outside Temperature

    defrost_sensor:
      name: Defrost Status

    nanoex_switch:
      name: Nanoe X

    current_power_consumption:
      name: Power Consumption

    operational_status:
      name: Operational Status

    indoor_humidity:
      name: Indoor Humidity

    diagnostic_temperature_byte_21:
      name: Diagnostic Temperature Byte 21

    # eco_switch:
    #   name: Eco

    # econavi_switch:
    #   name: Econavi

    # mild_dry_switch:
    #   name: Mild Dry

    

